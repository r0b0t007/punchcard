version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      laravel:
        patterns: ["laravel/*", "inertiajs/*", "filament/*"]
      dev-tools:
        dependency-type: "development"
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      # Vite+ pins its own Vite core and Vitest: bump them together, then
      # align the `vitest` override in package.json to the version `vp --version` shows.
      vite-plus:
        patterns: ["vite-plus", "vite", "@voidzero-dev/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*", "@inertiajs/*"]
      radix:
        patterns: ["@radix-ui/*"]
      tooling:
        dependency-type: "development"
        patterns: ["*"]
    ignore:
      # Types follow the Node version CI runs (22), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

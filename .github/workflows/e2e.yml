name: e2e

on:
  pull_request:
  # Also on main: only the base branch's cache is shared with every pull request.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The tap flow test (tests/e2e/tap-flow.spec.ts) writes tap URLs with punchcard:fake-tap,
    # which runs in local only (the demo seeder too).
    env:
      APP_ENV: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: intl, bcmath, pdo_sqlite
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # A throwaway SUN master key for this run only: fake taps are built and verified with it.
      - name: Generate a test SUN key
        run: echo "NFC_SUN_MASTER_KEY=$(openssl rand -hex 16 | tr a-f A-F)" >> "$GITHUB_ENV"

      - name: Install and build
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=pgsql/DB_CONNECTION=sqlite/' .env
          sed -i 's/^MAIL_MAILER=smtp/MAIL_MAILER=log/' .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --no-interaction
          npm run build

      # The browsers come from Playwright's CDN, and a slow download has run the job past its
      # timeout. Cache them per Playwright version, saved as soon as they are installed (whatever
      # the tests do). The install always runs: it skips the browsers the cache restored, so on a
      # hit it only installs the system packages, and it repairs an incomplete cache.
      - name: Read the Playwright version
        id: playwright
        run: |
          set -o pipefail
          version=$(npx playwright --version | awk '{print $2}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Install browsers
        timeout-minutes: 25
        run: npx playwright install --with-deps chromium webkit

      - name: Save browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: Run Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

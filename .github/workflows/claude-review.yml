name: claude-review

# AI review is advisory and uses Claude quota (subscription token or API key), so it runs only when the
# PR carries the `claude-review` label. The security review runs on PRs touching the stamp/reward/auth paths.
on:
  pull_request:
    types: [opened, synchronize, labeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read CLAUDE.md first; it lists the architecture rules and domain invariants.
            If the diff touches stamps, rewards, the /t tap endpoint, member QR tokens or tenant scoping,
            also apply .claude/agents/stamp-flow-reviewer.md and .claude/skills/stamp-flow/SKILL.md.
            Report only real problems: correctness, security, tenant isolation, missing tests, broken
            conventions (Actions pattern, i18n strings, logical RTL utilities). For each, give file:line,
            the failure scenario and the fix. No praise, no style nits the formatters already handle.
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"

  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets can't be read in step conditions, and fork PRs never receive them.
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for sensitive paths
        id: paths
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(app/Actions/(Stamps|Rewards|Auth)|app/Support/Nfc|app/Http/Controllers/(Tap|Wallet)|routes/|config/(auth|fortify|punchcard)\.php)'; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Warn when the security review cannot run
        if: steps.paths.outputs.sensitive == 'true' && env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::warning::Sensitive paths changed but no Claude credentials are set; security review skipped. Run the stamp-flow-reviewer agent locally."

      # claude-code-action rather than claude-code-security-review: the latter only accepts an API key,
      # this one also runs on a Claude subscription via CLAUDE_CODE_OAUTH_TOKEN.
      - uses: anthropics/claude-code-action@v1
        if: steps.paths.outputs.sensitive == 'true' && env.HAS_CLAUDE_AUTH == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}

            Security review of this PR. The PR branch is checked out. Read CLAUDE.md, then follow
            .claude/agents/stamp-flow-reviewer.md and the skills it names, reviewing `git diff BASE...HEAD`.
            Also check: broken access control and tenant isolation (business_id scoping, policies),
            injection, mass assignment, CSRF, secrets or raw SUN parameters in code or logs, and unsafe
            config in config/auth.php, config/fortify.php and config/punchcard.php.

            Report only real, exploitable problems, each with severity (CRITICAL/HIGH/MEDIUM/LOW),
            file:line, a concrete failure scenario and the fix. No style nits.
            Use mcp__github_inline_comment__create_inline_comment (confirmed: true) for line-level findings,
            then one `gh pr comment` headed "Security review" with a summary, or "Security review: no
            findings" if there are none. Only post GitHub comments.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"

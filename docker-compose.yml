# Local services for development. The app itself runs on your machine
# (Laravel Herd on Windows/macOS, or php artisan serve).
#   docker compose up -d
services:
    postgres:
        image: postgis/postgis:17-3.5
        environment:
            POSTGRES_DB: punchcard
            POSTGRES_USER: punchcard
            POSTGRES_PASSWORD: punchcard
        ports:
            # Set FORWARD_DB_PORT (and DB_PORT) in .env if 5432 is taken by a local Postgres.
            - '${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U punchcard -d punchcard']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '1025:1025'
            - '8025:8025'

volumes:
    postgres-data:
